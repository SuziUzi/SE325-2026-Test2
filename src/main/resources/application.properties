spring.application.name=robolab-booking
server.port=8080

# Persistent SQLite file created in the project directory. Open it with the sqlite3 CLI
# or a GUI such as DB Browser for SQLite to inspect bookings and who made them:
#   sqlite3 robolab.db "SELECT * FROM bookings;"
spring.datasource.url=jdbc:sqlite:robolab.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite permits only one writer at a time, so keep a single pooled connection.
spring.datasource.hikari.maximum-pool-size=1

# schema.sql uses CREATE TABLE IF NOT EXISTS and data.sql uses INSERT OR IGNORE,
# so running these on every start is safe and seeds the file only once.
spring.sql.init.mode=always
